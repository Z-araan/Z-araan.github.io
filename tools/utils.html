<main class="page">
  <div class="page-narrow">
    <nav class="crumbs" aria-label="面包屑"><a href="/">主页</a> / <span>实用小工具</span></nav>

    <header class="sub-head">
      <h1>实用小工具</h1>
      <p>时间戳、Base64、随机密码、UUID、颜色转换 —— 都在本地浏览器完成。</p>
    </header>

    <!-- 时间戳 -->
    <section class="panel">
      <div class="panel-head"><h2>时间戳转换</h2><span class="tag" id="now-ts">—</span></div>
      <div class="grid-2">
        <div>
          <div class="field">
            <label for="ts-input">时间戳（秒或毫秒，自动识别）</label>
            <input type="text" id="ts-input" class="mono" placeholder="1700000000">
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="ts-run" type="button">转为时间</button>
            <button class="btn btn-sm" id="ts-now" type="button">填入当前</button>
          </div>
          <div class="result" id="ts-out" hidden></div>
        </div>
        <div>
          <div class="field">
            <label for="dt-input">日期时间 → 时间戳</label>
            <input type="datetime-local" id="dt-input" step="1">
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="dt-run" type="button">转为时间戳</button>
            <button class="btn btn-sm" id="dt-now" type="button">设为现在</button>
          </div>
          <div class="result" id="dt-out" hidden></div>
        </div>
      </div>
    </section>

    <!-- Base64 -->
    <section class="panel">
      <div class="panel-head"><h2>Base64 编解码</h2><span class="tag">UTF-8 安全</span></div>
      <div class="field">
        <label for="b64-in">文本 / Base64</label>
        <textarea id="b64-in" class="code-area" style="min-height:6rem" placeholder="随便输入点什么…"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm btn-primary" id="b64-encode" type="button">编码 → Base64</button>
        <button class="btn btn-sm" id="b64-decode" type="button">解码 ← Base64</button>
        <button class="btn btn-sm" id="b64-copy" type="button">复制结果</button>
      </div>
      <div class="result" id="b64-out" hidden></div>
    </section>

    <!-- 随机密码 / UUID -->
    <section class="panel">
      <div class="panel-head"><h2>随机密码与 UUID</h2><span class="tag">本地生成</span></div>
      <div class="grid-2">
        <div>
          <div class="field">
            <label for="pwd-len">密码长度：<span id="pwd-len-value">20</span></label>
            <input type="range" id="pwd-len" min="6" max="64" value="20">
          </div>
          <div class="chips" style="margin-bottom:.8rem">
            <label class="chip-btn"><input type="checkbox" id="pwd-upper" checked> 大写</label>
            <label class="chip-btn"><input type="checkbox" id="pwd-lower" checked> 小写</label>
            <label class="chip-btn"><input type="checkbox" id="pwd-digit" checked> 数字</label>
            <label class="chip-btn"><input type="checkbox" id="pwd-symbol" checked> 符号</label>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="pwd-gen" type="button">生成密码</button>
            <button class="btn btn-sm" id="pwd-copy" type="button">复制</button>
          </div>
          <div class="result mono" id="pwd-out" hidden></div>
        </div>
        <div>
          <div class="field">
            <label for="uuid-count">UUID v4 数量</label>
            <input type="number" id="uuid-count" value="3" min="1" max="20">
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="uuid-gen" type="button">生成 UUID</button>
            <button class="btn btn-sm" id="uuid-copy" type="button">复制全部</button>
          </div>
          <div class="result mono" id="uuid-out" hidden></div>
        </div>
      </div>
    </section>

    <!-- 颜色 -->
    <section class="panel">
      <div class="panel-head"><h2>颜色转换</h2><span class="tag">HEX / RGB / HSL</span></div>
      <div class="row-between">
        <input type="color" id="color" value="#4ea1ff" style="width:84px;height:48px;padding:.2rem;border-radius:12px;border:1px solid var(--stroke);background:var(--panel)">
        <div class="result mono" id="color-out" style="margin:0;flex:1">#4ea1ff</div>
        <button class="btn btn-sm" id="color-copy" type="button">复制 HEX</button>
      </div>
    </section>
  </div>
</main>

<button class="to-top" id="to-top" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
</button>

<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };

    function show(el, text, cls) {
      el.hidden = false;
      el.className = 'result mono' + (cls ? ' ' + cls : '');
      el.textContent = text;
    }

    function copy(text, el) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () {
          show(el, text + '\n\n📋 已复制', 'ok');
        }, function () {});
      }
    }

    /* ---------- 时间戳 ---------- */
    function fmt(d) {
      var p = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
             p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    function tickNow() {
      $('now-ts').textContent = '现在：' + Math.floor(Date.now() / 1000) + '（秒）';
    }
    tickNow();
    setInterval(tickNow, 1000);

    $('ts-run').addEventListener('click', function () {
      var v = $('ts-input').value.trim();
      if (!/^-?\d+$/.test(v)) { show($('ts-out'), '请输入纯数字时间戳。', 'err'); return; }
      var n = Number(v);
      var ms = v.length <= 11 ? n * 1000 : n;      // 10 位按秒，13 位按毫秒
      var d = new Date(ms);
      if (isNaN(d.getTime())) { show($('ts-out'), '时间戳超出可表示范围。', 'err'); return; }
      show($('ts-out'),
        '本地时间：' + fmt(d) + '\n' +
        'UTC 时间 ：' + d.toISOString() + '\n' +
        '识别为  ：' + (v.length <= 11 ? '秒（×1000 处理）' : '毫秒') + '\n' +
        '星期    ：' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()], 'ok');
    });
    $('ts-now').addEventListener('click', function () {
      $('ts-input').value = String(Math.floor(Date.now() / 1000));
      $('ts-run').click();
    });

    $('dt-run').addEventListener('click', function () {
      var v = $('dt-input').value;
      if (!v) { show($('dt-out'), '请先选择日期时间。', 'err'); return; }
      var d = new Date(v);
      var sec = Math.floor(d.getTime() / 1000);
      show($('dt-out'), '秒  ：' + sec + '\n毫秒：' + d.getTime() + '\n本地：' + fmt(d), 'ok');
    });
    $('dt-now').addEventListener('click', function () {
      var d = new Date();
      var off = d.getTimezoneOffset() * 60000;
      $('dt-input').value = new Date(d.getTime() - off).toISOString().slice(0, 19);
      $('dt-run').click();
    });

    /* ---------- Base64（UTF-8 安全） ---------- */
    $('b64-encode').addEventListener('click', function () {
      var text = $('b64-in').value;
      if (!text) { show($('b64-out'), '请输入要编码的文本。', 'err'); return; }
      var bytes = new TextEncoder().encode(text);
      var bin = '';
      bytes.forEach(function (b) { bin += String.fromCharCode(b); });
      show($('b64-out'), btoa(bin), 'ok');
    });
    $('b64-decode').addEventListener('click', function () {
      var text = $('b64-in').value.trim();
      if (!text) { show($('b64-out'), '请输入要解码的 Base64。', 'err'); return; }
      try {
        var bin = atob(text.replace(/\s+/g, ''));
        var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
        show($('b64-out'), new TextDecoder().decode(bytes), 'ok');
      } catch (e) {
        show($('b64-out'), '❌ 不是合法的 Base64：' + e.message, 'err');
      }
    });
    $('b64-copy').addEventListener('click', function () {
      if (!$('b64-out').hidden) copy($('b64-out').textContent, $('b64-out'));
    });

    /* ---------- 随机密码 ---------- */
    $('pwd-len').addEventListener('input', function () {
      $('pwd-len-value').textContent = $('pwd-len').value;
    });
    $('pwd-gen').addEventListener('click', function () {
      var upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ', lower = 'abcdefghijkmnopqrstuvwxyz';
      var digit = '23456789', symbol = '!@#$%^&*()-_=+[]{};:,.?';
      var pool = '';
      if ($('pwd-upper').checked) pool += upper;
      if ($('pwd-lower').checked) pool += lower;
      if ($('pwd-digit').checked) pool += digit;
      if ($('pwd-symbol').checked) pool += symbol;
      if (!pool) { show($('pwd-out'), '至少勾选一类字符。', 'err'); return; }
      var len = Number($('pwd-len').value);
      var arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      var pwd = Array.from(arr, function (n) { return pool[n % pool.length]; }).join('');
      show($('pwd-out'), pwd, 'ok');
    });
    $('pwd-copy').addEventListener('click', function () {
      if (!$('pwd-out').hidden) copy($('pwd-out').textContent, $('pwd-out'));
    });

    /* ---------- UUID ---------- */
    function uuid4() {
      if (crypto.randomUUID) return crypto.randomUUID();
      var b = new Uint8Array(16);
      crypto.getRandomValues(b);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      var hex = Array.from(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
      return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' +
             hex.slice(16, 20) + '-' + hex.slice(20);
    }
    $('uuid-gen').addEventListener('click', function () {
      var n = Math.min(20, Math.max(1, Number($('uuid-count').value) || 1));
      var list = [];
      for (var i = 0; i < n; i++) list.push(uuid4());
      show($('uuid-out'), list.join('\n'), 'ok');
    });
    $('uuid-copy').addEventListener('click', function () {
      if (!$('uuid-out').hidden) copy($('uuid-out').textContent, $('uuid-out'));
    });

    /* ---------- 颜色 ---------- */
    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h /= 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }
    function updateColor() {
      var hex = $('color').value;
      var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      var hsl = rgbToHsl(r, g, b);
      $('color-out').textContent = hex + '   rgb(' + r + ', ' + g + ', ' + b + ')   hsl(' +
        hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
    }
    $('color').addEventListener('input', updateColor);
    updateColor();
    $('color-copy').addEventListener('click', function () {
      copy($('color').value, $('color-out'));
    });
  })();
</script>
</body>
