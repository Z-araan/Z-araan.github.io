      <p>我心里有一个 1 到 100 之间的数字，看看你几次能猜中。</p>

    <section class="panel game-box">
      <label class="sr-only" for="guess">输入你猜的数字</label>
      <input class="big-input" type="number" id="guess" min="1" max="100" placeholder="?" inputmode="numeric">
      <div class="btn-row" style="justify-content:center">

        <button class="btn" id="reset-game" type="button">再来一局</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="hint" id="attempts"></p>
