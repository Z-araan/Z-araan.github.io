<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>局域网聊天 · Z-araan</title>
<meta name="description" content="同一局域网内互传消息与文件，无需服务器中转。">
<link rel="icon" href="/images/favicon.ico">
<link rel="stylesheet" href="../styles/main.css">
<link rel="stylesheet" href="../styles/sub.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
    } catch (e) {}
  })();
</script>
<script src="../scripts/main.js" defer></script>
<script src="scripts/xchatuser.js"></script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="brand-dot" aria-hidden="true"></span><span class="brand-name">Z-araan</span></a>
    <nav class="nav-links" id="nav-links" aria-label="主导航">
      <a href="/">主页</a>
      <a href="/#projects">工具</a>
      <a href="tomato.html">番茄钟</a>
      <a href="numbers.html">猜数字</a>
      <a href="https://zaraan.zh.kg/" target="_blank" rel="noopener">博客</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色/浅色主题" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.2A8.6 8.6 0 0 1 10.8 3a8.6 8.6 0 1 0 10.2 10.2Z"/></svg>
      </button>
      <button class="icon-btn nav-burger" id="nav-burger" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="chat-app">
  <div class="left">
    <div class="chat-wrapper" aria-live="polite" aria-label="聊天记录"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="toolbar-btn nickname-btn" type="button" title="设置昵称" aria-label="设置昵称">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </button>
        <button class="toolbar-btn file-btn" type="button" title="发送文件（或直接拖进页面）" aria-label="发送文件">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <button class="toolbar-btn" id="requestNotificationPermission" type="button" title="开启桌面通知" aria-label="开启桌面通知">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10.5 21a2 2 0 0 0 3 0"/></svg>
        </button>
        <button class="toolbar-btn" id="createRoomBtn" type="button" title="创建房间 / 设置密码" aria-label="创建房间">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="5"/><path d="M12.5 12.5 20 20m-3.5-.5L18 18"/></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <button class="toolbar-btn toggle-users-btn mobile-only" type="button" title="在线用户" aria-label="在线用户">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 7a3 3 0 0 1 0 6m1.5 7c0-2-.6-3.4-1.7-4.3"/></svg>
        </button>
        <button class="toolbar-btn send-btn" type="button" title="发送消息（Ctrl/⌘+Enter）" aria-label="发送消息">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-7 16-2.2-6.2L4 12Z"/></svg>
        </button>
      </div>
    </div>

    <textarea id="messageInput" class="txt-msg" placeholder="输入消息…（Ctrl/⌘+Enter 发送，文件可直接拖进页面）" onkeydown="enterTxt(event)"></textarea>
  </div>

  <aside class="right">
    <h3>在线用户</h3>
    <ul id="users"></ul>
  </aside>
</main>

<div class="mobile-overlay"></div>

<div class="dragtip"><h1>松开发送文件</h1></div>

<div class="modal" id="userSelectModal">
  <div class="modal-content">
    <h3>选择接收用户</h3>
    <div class="user-list" id="userSelectList"></div>
    <div class="progress-container" style="display: none;">
      <div class="progress-text">正在发送…</div>
      <div class="progress-bar"><div class="progress-bar-inner"></div></div>
    </div>
    <div class="modal-footer">
      <button type="button" onclick="cancelSendFile()">取消</button>
      <button type="button" onclick="confirmSendFile()">发送</button>
    </div>
  </div>
</div>

<div class="modal" id="nicknameModal">
  <div class="modal-content">
    <h3>设置昵称</h3>
    <div class="nickname-input-container">
      <input type="text" id="nicknameInput" maxlength="10" placeholder="请输入昵称（最多 10 个字符）">
    </div>
    <div class="modal-footer">
      <button type="button" onclick="closeNicknameModal()">取消</button>
      <button type="button" onclick="saveNickname()">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="passwordModal">
  <div class="modal-content">
    <h3>请输入房间密码</h3>
    <div class="nickname-input-container">
      <input type="password" id="roomPasswordInput" placeholder="请输入密码" autocomplete="off" name="password_fake">
    </div>
    <div class="modal-footer">
      <button type="button" onclick="submitRoomPassword()">确认</button>
    </div>
  </div>
</div>

<script src="scripts/index.js"></script>
</body>
</html>
