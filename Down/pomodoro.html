    <header class="sub-head">
      <h1>番茄计时器</h1>
      <p>专注一段时间，休息一小会；结束时会响内置提示音（无需联网）。</p>
    </header>

    <section class="panel timer-card">
      <div id="timer-display" role="timer" aria-live="off">25:00</div>
      <p id="status">工作时间</p>

      <div class="timer-btns">
        <button class="btn btn-primary" id="start-btn" type="button">开始</button>
        <button class="btn" id="pause-btn" type="button">暂停</button>
        <button class="btn" id="reset-btn" type="button">重置</button>
      </div>

        </div>

          <label for="break-time">休息时长（分钟）</label>
          <input type="number" id="break-time" value="5" min="1" max="60">
